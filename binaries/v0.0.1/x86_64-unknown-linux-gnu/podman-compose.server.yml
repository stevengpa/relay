version: '3.8'

services:
  relay-server:
    image: ubuntu:24.04
    container_name: relay-server
    ports:
      - "8080:8080"  # Expose HTTP server port
      - "9090:9090"  # Expose GRPC port
    volumes:
      - ./server:/app/server:ro
    command: /app/server
    environment:
      - HTTP_PORT=8080
      - GRPC_PORT=9090
      - LOG_LEVEL=info
    restart: unless-stopped