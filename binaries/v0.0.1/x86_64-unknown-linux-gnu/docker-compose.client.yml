version: '3.8'

services:
  relay-client:
    image: image: ubuntu:24.04
    container_name: relay-client
    ports:
      - "9090:9090"  # Expose client port
    volumes:
      - ./client:/app/client:ro
    command: /app/client
    environment:
      - CLIENT_PORT=9090
      - SERVER_ADDRESS=relay-server:9090  # Assuming server is on same network (GRPC port)
      - LOG_LEVEL=info
    depends_on:
      - relay-server
    restart: unless-stopped